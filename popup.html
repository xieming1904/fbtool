<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Facebook广告助手</title>
  <link rel="stylesheet" href="popup.css">
  <!-- 使用本地 Chart.js -->
  <script src="vendor/chart.min.js"></script>
  <script src="images/icons.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Facebook广告助手</h1>
      <div class="tool-selector">
        <select id="toolSelector">
          <option value="adCapture">广告捕获</option>
          <option value="accountManager">账号管理</option>
          <option value="adLibrary">广告库下载工具</option>
        </select>
      </div>
    </header>

    <!-- 工具页面容器 -->
    <div class="tool-container">
      <!-- 广告捕捉工具 -->
      <div id="adCaptureTool" class="tool-page active">
        <div class="capture-container">
          <!-- 控制面板 -->
          <div class="control-panel">
            <div class="time-filter">
              <select id="timeRange">
                <option value="24h">最近24小时</option>
                <option value="7d">最近7天</option>
                <option value="30d">最近30天</option>
                <option value="all">全部时间</option>
              </select>
              <button id="refreshBtn" class="btn">刷新数据</button>
            </div>
            <div class="stats">
              <div class="stat-item">
                <span>已捕获广告:</span>
                <span id="totalAds">0</span>
              </div>
              <div class="stat-item">
                <span>广告主数量:</span>
                <span id="totalAdvertisers">0</span>
              </div>
            </div>
          </div>

          <!-- 标签页导航 -->
          <div class="tabs">
            <button class="tab-btn active" data-tab="trends">趋势分析</button>
            <button class="tab-btn" data-tab="audience">受众分析</button>
            <button class="tab-btn" data-tab="content">内容分析</button>
            <button class="tab-btn" data-tab="performance">效果分析</button>
          </div>

          <!-- 标签页内容 -->
          <div class="tab-content">
            <!-- 趋势分析 -->
            <div id="trends" class="tab-pane active">
              <div class="chart-container">
                <canvas id="trendChart"></canvas>
              </div>
            </div>

            <!-- 受众分析 -->
            <div id="audience" class="tab-pane">
              <div class="chart-container">
                <canvas id="ageChart"></canvas>
              </div>
              <div class="chart-container">
                <canvas id="genderChart"></canvas>
              </div>
            </div>

            <!-- 内容分析 -->
            <div id="content" class="tab-pane">
              <div class="chart-container">
                <canvas id="interestsChart"></canvas>
              </div>
            </div>

            <!-- 效果分析 -->
            <div id="performance" class="tab-pane">
              <div class="chart-container">
                <canvas id="effectivenessChart"></canvas>
              </div>
            </div>
          </div>

          <!-- 最近捕获的广告 -->
          <div class="recent-ads">
            <div class="recent-ads-header">
              <h3>最近捕获的广告</h3>
              <!-- 搜索栏 -->
              <div class="search-bar">
                <div class="search-input">
                  <input type="text" id="adSearchInput" placeholder="搜索广告内容、广告主...">
                  <select id="searchFilter">
                    <option value="all">全部</option>
                    <option value="content">广告内容</option>
                    <option value="advertiser">广告主</option>
                    <option value="type">广告类型</option>
                  </select>
                </div>
                <button id="searchAdsBtn" class="btn">搜索</button>
              </div>
            </div>
            <div id="recent-ads" class="recent-ads-list"></div>
          </div>
        </div>
      </div>

      <!-- 广告库下载工具 -->
      <div id="adLibraryTool" class="tool-page">
        <div class="library-tool">
          <div class="tool-header">
            <h2>广告库视频下载工具</h2>
            <p>使用说明：</p>
            <ol>
              <li>打开 Facebook 广告库页面</li>
              <li>鼠标悬停在视频上会显示下载按钮</li>
              <li>点击下载按钮选择视频质量</li>
              <li>等待下载完成</li>
            </ol>
          </div>
          
          <div class="download-history">
            <h3>下载历史</h3>
            <div class="history-list" id="downloadHistory">
              <!-- 下载历史将在这里显示 -->
            </div>
          </div>
          
          <div class="tool-actions">
            <button id="openAdLibrary" class="btn btn-primary">打开广告库</button>
            <button id="clearHistory" class="btn">清除历史</button>
          </div>
        </div>
      </div>

      <!-- 广告账号管理工具 -->
      <div id="accountManagerTool" class="tool-page">
        <div class="account-manager-preview">
          <div class="preview-header">
            <h2>广告账号管理</h2>
            <p>管理和监控您的Facebook广告账号</p>
          </div>
          <div class="preview-actions">
            <button id="openAccountManager" class="btn btn-primary">打开账号管理器</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="actions">
        <button id="exportBtn" class="btn">导出数据</button>
        <div class="export-format">
          <label>
            <input type="radio" name="format" value="json" checked> JSON
          </label>
          <label>
            <input type="radio" name="format" value="csv"> CSV
          </label>
        </div>
      </div>
      <div class="status" id="status"></div>
    </footer>
  </div>
  <script src="charts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
